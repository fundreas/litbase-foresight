name: Forecast

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC only, so 22:10 and 22:40 Berlin time need two entries
    # each: 21:xx UTC in winter (CET) and 20:xx UTC in summer (CEST). The first
    # step of the job drops whichever pair does not currently match 22:xx Berlin.
    - cron: '10 20 * * *'
    - cron: '40 20 * * *'
    - cron: '10 21 * * *'
    - cron: '40 21 * * *'

# Runs must never overlap, and a running forecast is worth more than a queued one
concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # for the keepalive commit
    outputs:
      published: ${{ steps.forecast.outputs.published }}  # output exists, deploy it
      fresh: ${{ steps.forecast.outputs.fresh }}          # informational: was it today's data
      mv_date: ${{ steps.forecast.outputs.mv_date }}
    steps:
      - name: Decide whether this is the 22:xx Berlin run
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run at Berlin hour $hour, not gating on the clock."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "22" ]; then
            echo "Berlin hour is $hour, this is the run for today."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Berlin hour is $hour, not 22. This cron entry belongs to the other DST offset, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast
        id: forecast
        if: steps.gate.outputs.run == 'true'
        env:
          # Credentials rather than a token: a Kickbase JWT lives seven days, so a
          # daily schedule has to be able to mint its own on every run.
          KICK_USER: ${{ secrets.KICK_USER }}
          KICK_PASS: ${{ secrets.KICK_PASS }}
        run: python run_forecast.py --competition-id 1 --horizon-days 5 --output-dir output

      - name: Report the market value date
        if: steps.forecast.outputs.mv_date != ''
        run: |
          echo "Market value date: ${{ steps.forecast.outputs.mv_date }} (today's data: ${{ steps.forecast.outputs.fresh }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.forecast.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

      # Scheduled workflows are paused after 60 days without a commit on a public
      # repo, and publishing from an artifact never commits. So push an empty commit
      # once the last one is 45 days old. Done inline rather than with a third-party
      # action, which is one less thing that can be blocked or go unmaintained.
      # Runs even when the forecast failed, so a broken run cannot also let the
      # schedule lapse. Only on a schedule, where the ref is the default branch.
      - name: Keep the schedule alive
        if: always() && steps.gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          if [ ! -d .git ]; then
            echo "No checkout in this run, nothing to keep alive."
            exit 0
          fi

          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit is $age day(s) old."

          if [ "$age" -lt 45 ]; then
            echo "Under 45 days, the schedule is in no danger."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Keep the scheduled workflow alive'
          git push
          echo "Pushed an empty commit to reset the 60 day timer."

  deploy:
    needs: forecast
    if: needs.forecast.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
